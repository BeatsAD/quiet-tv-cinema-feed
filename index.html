<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiet TV 每日电影</title>
<style>body{font:18px/1.7 system-ui,sans-serif;max-width:860px;margin:8vh auto;padding:24px;background:#101215;color:#eee}a{color:#9bc8fa}img{max-width:100%;border-radius:12px}footer{margin-top:40px;font-size:14px;color:#aaa}footer img{width:120px;border-radius:0}</style>
<h1>Quiet TV 每日电影</h1>
<p id="status">正在获取今日推荐…</p>
<main hidden id="content"><img id="picture" alt="电影背景图"><h2 id="title"></h2><p id="overview"></p><a id="source" rel="noreferrer">在 TMDB 查看影片</a></main>
<footer><img src="tmdb.svg" alt="TMDB"><p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p><p>影片资料来自 TMDB。图片版权属于各自权利人。</p></footer>
<script>
fetch('latest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(f=>{
if(f.schema_version!==1||!/^images\/\d+\/[a-f0-9]{64}\.jpg$/.test(f.image.path))throw Error();
document.querySelector('#picture').src=f.image.path;
document.querySelector('#title').textContent=f.movie.title+'  '+f.movie.year+'  TMDB '+f.movie.rating.value;
document.querySelector('#overview').textContent=f.movie.overview;
document.querySelector('#source').href='https://www.themoviedb.org/movie/'+Number(f.movie.id);
document.querySelector('#status').textContent=f.content_date;
document.querySelector('#content').hidden=false;
}).catch(()=>document.querySelector('#status').textContent='今日内容暂不可用，请稍后再试。');
</script>
</html>
